server:
  port: 8080 #?

spring:
  application:
    name: order-service
    main:
      web-application-type: servlet
    kafka:
      bootstrap-servers: kafka:9092

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka  # 도커 네트워크 안 붙일거면 localhost
    fetchRegistry: true
    registerWithEureka: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0  # Zipkin 확인용