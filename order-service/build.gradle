/*
 * order-service 빌드 설정
 *
 * 주문 생성, 상태 관리, 이벤트 발행을 담당하는 핵심 서비스
 */
plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'java'
}

dependencies {
    // Spring Boot 핵심 의존성
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'  // REST API
    implementation 'org.springframework.boot:spring-boot-starter-validation'  // @Valid 검증
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'  // Order 엔티티 저장

    // 서비스 디스커버리 (Eureka)
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'

    // 메시징 (Kafka)
    implementation 'org.springframework.kafka:spring-kafka'  // PaymentEventHandler

    // 분산 추적 (Zipkin)
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'  // Micrometer → Brave 브리지
    implementation 'io.zipkin.reporter2:zipkin-reporter-brave'  // Brave → Zipkin 리포터

    // 모니터링 (Actuator)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'  // /actuator/health 등

    // 공통 라이브러리 (Outbox 패턴, 이벤트 정의, 예외 처리)
    implementation project(':common-lib')

    // PostgreSQL 드라이버
    runtimeOnly 'org.postgresql:postgresql:42.7.3'

    // Lombok (보일러플레이트 코드 자동 생성)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
}