spring:
  application:
    name: outbox-relay
  datasource:
    url: jdbc:postgresql://localhost:5433/orderdb
    username: order
    password: order
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  kafka:
    bootstrap-servers: localhost:29092

relay:
  batchSize: 50
  pollMs: 500
