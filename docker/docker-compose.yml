# MSA 주문/클레임 시스템 인프라스트럭처 설정
#
# 실행 방법: docker-compose -f docker/docker-compose.yml up -d
# 종료 방법: docker-compose -f docker/docker-compose.yml down
#
# 포함된 서비스:
# - Kafka & Zookeeper: 이벤트 기반 통신
# - Kafka UI: Kafka 토픽 및 메시지 모니터링
# - Zipkin: 분산 추적 시각화
# - PostgreSQL: 서비스별 데이터베이스 (order-service, claim-service)

version: "3.9"
services:
  # Apache Zookeeper: Kafka 클러스터 메타데이터 관리
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181  # 클라이언트 연결 포트
    ports: ["2181:2181"]

  # Apache Kafka: 이벤트 스트리밍 플랫폼
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    hostname: kafka  # 내부에서 'kafka'가 자기 자신으로 확실히 해석되게
    depends_on: [ zookeeper ]
    ports:
      - "29092:29092"  # 호스트(Spring Boot 애플리케이션)에서 접근 시 사용
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # 리스너 설정: 내부(도커 네트워크)/외부(호스트) 분리
      # - PLAINTEXT (9092): 도커 컨테이너 간 통신 (향후 확장 시 사용)
      # - EXTERNAL (29092): 호스트(localhost)에서 접근
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OPTS: "-Djava.net.preferIPv4Stack=true -Djava.net.preferIPv4Addresses=true"

      # 단일 브로커 환경 필수 설정 (개발용)
      # 프로덕션에서는 replication factor를 3 이상으로 설정 권장
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_NUM_PARTITIONS: 1  # 기본 파티션 수
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"  # 토픽 자동 생성 활성화

  # Kafka UI: Kafka 토픽, 메시지, 컨슈머 그룹 모니터링
  # 접근: http://localhost:8085
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on: [kafka]
    ports: ["8085:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  # Zipkin: 분산 추적 시스템
  # 모든 서비스의 traceId를 기반으로 요청 흐름을 시각화
  # 접근: http://localhost:9411
  zipkin:
    image: openzipkin/zipkin:2.24
    ports: ["9411:9411"]

  # PostgreSQL (order-service용)
  # 연결: jdbc:postgresql://localhost:5433/orderdb
  # user: order / password: order
  postgres-order:
    image: postgres:16
    environment:
      POSTGRES_USER: order
      POSTGRES_PASSWORD: order
      POSTGRES_DB: orderdb
    ports: ["5433:5432"]  # 호스트 5433 → 컨테이너 5432

  # PostgreSQL (claim-service용)
  # 연결: jdbc:postgresql://localhost:5434/claimdb
  # user: claim / password: claim
  postgres-claim:
    image: postgres:16
    environment:
      POSTGRES_USER: claim
      POSTGRES_PASSWORD: claim
      POSTGRES_DB: claimdb
    ports: ["5434:5432"]  # 호스트 5434 → 컨테이너 5432