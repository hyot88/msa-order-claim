/*
 * common-lib 모듈 빌드 설정
 *
 * 이 모듈은 모든 마이크로서비스에서 공통으로 사용하는 코드를 제공합니다:
 * - 이벤트 정의 (OrderEvents)
 * - Outbox 패턴 구현 (OutboxEvent, OutboxEventPublisher, OutboxRepository)
 * - 전역 예외 처리 (GlobalExceptionHandler, ErrorResponse)
 * - 공통 예외 클래스 (OrderNotFoundException, OutboxPublishException)
 *
 * 각 서비스의 build.gradle에서 implementation project(':common-lib')로 의존성 추가
 */
dependencies {
    // JSON 직렬화/역직렬화 (이벤트 페이로드 변환)
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // JPA 표준 API (OutboxEvent 엔티티 정의)
    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'

    // Bean Validation (요청 DTO 검증용)
    implementation 'jakarta.validation:jakarta.validation-api:3.0.2'

    // Hibernate (JSONB 타입 지원)
    implementation 'org.hibernate.orm:hibernate-core:6.5.2.Final'

    // Spring Data JPA (OutboxRepository 인터페이스)
    implementation 'org.springframework.data:spring-data-jpa:3.3.3'

    // Spring Context (Component 스캔 및 의존성 주입)
    implementation 'org.springframework:spring-context:6.1.11'

    // Spring Web (REST 컨트롤러 예외 처리)
    implementation 'org.springframework:spring-web:6.1.11'

    // Spring Kafka (Kafka 메시징 - 현재 미사용, 향후 확장 가능)
    implementation 'org.springframework.kafka:spring-kafka:3.2.3'

    // Micrometer Tracing (분산 추적 컨텍스트 전파)
    implementation 'io.micrometer:micrometer-tracing:1.3.3'

    // SLF4J 로깅 API
    implementation 'org.slf4j:slf4j-api:2.0.13'

    // Lombok (보일러플레이트 코드 자동 생성)
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
}