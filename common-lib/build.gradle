dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    implementation 'jakarta.validation:jakarta.validation-api:3.0.2'
    implementation 'org.hibernate.orm:hibernate-core:6.5.2.Final'
    implementation 'org.springframework.data:spring-data-jpa:3.3.3'
    implementation 'org.springframework:spring-context:6.1.11'
    implementation 'org.springframework:spring-web:6.1.11'
    implementation 'org.springframework.kafka:spring-kafka:3.2.3'
    implementation 'io.micrometer:micrometer-tracing:1.3.3'
    implementation 'org.slf4j:slf4j-api:2.0.13'
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
}